<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Setu ERP</title>
    <!--
      Font Awesome is now bundled locally via npm (imported in index.tsx).
      The external CDN link has been removed because it was causing the
      Electron render thread to block on a network request during startup,
      which made ALL input fields appear frozen until the request completed.
    -->
    <style>
      /* Custom scrollbar */
      .custom-scrollbar::-webkit-scrollbar { width: 6px; }
      .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
      .custom-scrollbar::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #cbd5e1; }

      /* Print styles */
      @media print {
        aside, header, .print-hidden, .no-print, button, .filter-bar { display: none !important; }
        main { margin: 0 !important; padding: 0 !important; }
        body { background-color: white !important; }
      }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
